name: Pubblica su Facebook

# Quando un articolo passa da bozza a pubblicato, manda il post sulla pagina
# Facebook con il testo per intero e il link in fondo.
#
# Gira solo se i due segreti esistono: finche non li imposti, questo file non
# fa niente e non da errore. I segreti si creano in
# Settings > Secrets and variables > Actions e si chiamano
# FACEBOOK_PAGINA e FACEBOOK_TOKEN.
#
# I commit fatti dall automazione delle date non la riattivano.

on:
  push:
    branches: [main]
    paths:
      - 'src/contenuti/articoli/**'

jobs:
  pubblica:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    # I segreti vanno portati qui, in variabili d ambiente, prima di poterli
    # usare: GitHub non consente di leggerli dentro una condizione "if", e
    # provarci rende il file invalido - il workflow fallisce in zero secondi
    # senza nemmeno partire, che e' esattamente quello che succedeva prima.
    env:
      FACEBOOK_PAGINA: ${{ secrets.FACEBOOK_PAGINA }}
      FACEBOOK_TOKEN: ${{ secrets.FACEBOOK_TOKEN }}

    steps:
      - name: Scarica il progetto con la storia
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepara Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Manda il post
        if: env.FACEBOOK_TOKEN != '' && env.FACEBOOK_PAGINA != ''
        run: node scripts/pubblica-su-facebook.mjs ${{ github.event.before }} ${{ github.sha }} --invia

      - name: Avvisa che i segreti non ci sono
        if: env.FACEBOOK_TOKEN == '' || env.FACEBOOK_PAGINA == ''
        run: echo "FACEBOOK_PAGINA o FACEBOOK_TOKEN non impostati: nessun post inviato."
