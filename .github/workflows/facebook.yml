name: Pubblica su Facebook

# Quando un articolo passa da bozza a pubblicato, manda il post sulla pagina
# Facebook con il testo per intero e il link in fondo.
#
# Finche i segreti FACEBOOK_PAGINA e FACEBOOK_TOKEN non esistono, lo script
# lo dice e si ferma senza errore. Il controllo sta li e non qui: tenere il
# file YAML il piu semplice possibile evita che il workflow diventi invalido,
# cosa che e gia successa.
#
# I segreti si creano in Settings > Secrets and variables > Actions.

on:
  push:
    branches: [main]
    paths:
      - 'src/contenuti/articoli/**'

jobs:
  pubblica:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Manda il post
        env:
          FACEBOOK_PAGINA: ${{ secrets.FACEBOOK_PAGINA }}
          FACEBOOK_TOKEN: ${{ secrets.FACEBOOK_TOKEN }}
        run: node scripts/pubblica-su-facebook.mjs ${{ github.event.before }} ${{ github.sha }} --invia
