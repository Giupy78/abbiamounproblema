# Impostazioni del pannello di scrittura (Decap CMS).
#
# I campi qui sotto rispecchiano esattamente la struttura degli articoli
# definita in src/content.config.ts. Se un giorno aggiungi una categoria
# in src/config.ts, ricordati di aggiungerla anche qui sotto, alla voce
# "categoria": sono due elenchi separati che devono restare allineati.

backend:
  name: github
  repo: Giupy78/abbiamounproblema
  branch: main
  # Indirizzo del servizio di autenticazione, che vive dentro questo stesso
  # sito (cartella functions/api). Deve coincidere con l indirizzo da cui
  # apri il pannello e con quello configurato nell applicazione GitHub.
  base_url: https://abbiamounproblema.it
  auth_endpoint: api/auth

# Lingua dell'interfaccia del pannello.
locale: it

# Dove finiscono le immagini caricate dal pannello.
# public_folder e il percorso scritto dentro l'articolo: "./media/foto.jpg"
# e relativo al file dell'articolo, ed e la forma che Astro sa ottimizzare.
media_folder: src/contenuti/articoli/media
public_folder: ./media

# Ogni salvataggio va direttamente sul sito, senza passaggi di revisione.
publish_mode: simple

# Messaggi di salvataggio in italiano nella cronologia del progetto.
backend_commit_messages:
  create: 'Nuovo articolo: {{slug}}'
  update: 'Aggiornato articolo: {{slug}}'
  delete: 'Rimosso articolo: {{slug}}'
  uploadMedia: 'Caricata immagine: {{path}}'
  deleteMedia: 'Rimossa immagine: {{path}}'

collections:
  # ---------------------------------------------------------------
  # Impostazioni: il menu e le pagine fisse.
  #
  # A differenza di Articoli e Proposte, qui non si creano documenti
  # nuovi: si modificano quelli che esistono. Ogni salvataggio fa
  # ripartire la pubblicazione del sito, come per un articolo.
  # ---------------------------------------------------------------
  - name: impostazioni
    label: Impostazioni
    description: 'Il menu in cima al sito e le pagine che non sono articoli.'
    files:
      - name: menu
        label: 'Menu del sito'
        file: src/dati/menu.json
        description: >-
          Le voci che compaiono in alto e in fondo a ogni pagina.
          Trascinale per cambiarne l ordine.
        fields:
          - name: voci
            label: 'Voci del menu'
            widget: list
            label_singular: 'voce'
            summary: '{{fields.testo}}  →  {{fields.url}}'
            min: 1
            max: 8
            fields:
              - name: testo
                label: 'Come si legge'
                widget: string
                hint: 'Il testo che vede chi naviga. Corto: la barra ha poco spazio.'
                pattern: ['^.{1,24}$', 'Massimo 24 caratteri']
              - name: url
                label: 'Dove porta'
                widget: string
                hint: >-
                  Indirizzo interno, con la barra davanti e senza barra finale:
                  /archivio, /proposte, /chi-sono. La home e solo /
                pattern:
                  ['^/($|[a-z0-9-]+(/[a-z0-9-]+)*$)', 'Deve cominciare con / e non finire con /']

      - name: meccanismi
        label: 'Pagina: I meccanismi'
        file: src/dati/meccanismi.json
        description: >-
          La pagina che spiega i tre schemi ricorrenti. Finche "Tienila in
          bozza" resta acceso non e nel menu e non e visibile su Google.
        fields:
          - name: bozza
            label: 'Tienila in bozza'
            widget: boolean
            default: true
            hint: >-
              Acceso: la pagina esiste ma la vedi solo tu andando all indirizzo.
              Spento: diventa pubblica. Ricordati di aggiungerla anche al menu.
          - name: titolo
            label: 'Titolo della pagina'
            widget: string
          - name: descrizione
            label: 'Descrizione per Google'
            widget: text
            hint: 'Fra 70 e 170 caratteri: e il testo che appare nei risultati di ricerca.'
          - name: apertura
            label: 'Testo di apertura'
            widget: markdown
          - name: catena
            label: 'La sequenza in evidenza'
            widget: list
            label_singular: 'passaggio'
            field: { name: passo, label: Passaggio, widget: string }
            hint: 'I passaggi del riquadro in alto, collegati dalle frecce.'
          - name: dopoCatena
            label: 'Testo sotto la sequenza'
            widget: markdown
          - name: stadi
            label: 'Gli stadi della catena'
            widget: list
            label_singular: 'stadio'
            summary: '{{fields.ruolo}} — {{fields.titolo}}'
            fields:
              - { name: ruolo, label: 'Ruolo nella catena', widget: string, hint: 'Esempio: La causa' }
              - { name: titolo, label: 'Titolo dello stadio', widget: string }
              - { name: sintesi, label: 'Spiegazione', widget: markdown }
              - name: articoli
                label: 'Articoli che lo mostrano'
                widget: list
                label_singular: 'articolo'
                field: { name: slug, label: 'Nome del file', widget: string }
                hint: >-
                  Il nome del file dell articolo senza estensione, cioe l ultimo
                  pezzo del suo indirizzo. Le bozze non compaiono finche non le pubblichi.
          - name: sezioni
            label: 'Sezioni di approfondimento'
            widget: list
            label_singular: 'sezione'
            summary: '{{fields.titolo}}'
            fields:
              - { name: titolo, label: Titolo, widget: string }
              - { name: testo, label: Testo, widget: markdown }
          - { name: domandeTitolo, label: 'Titolo delle domande', widget: string }
          - { name: domandeIntro, label: 'Introduzione alle domande', widget: markdown }
          - name: domande
            label: 'Le domande finali'
            widget: list
            label_singular: 'domanda'
            summary: '{{fields.domanda}}'
            fields:
              - { name: domanda, label: Domanda, widget: string }
              - { name: nota, label: 'Nota sotto la domanda', widget: string }
          - { name: chiusura, label: 'Testo di chiusura', widget: markdown }

  - name: articoli
    label: Articoli
    label_singular: Articolo
    description: 'Tutti i pezzi del sito. Finche "Bozza" resta acceso, l articolo si vede solo da te.'
    folder: src/contenuti/articoli
    create: true
    extension: md
    format: yaml-frontmatter
    identifier_field: titolo
    slug: '{{slug}}'
    # Il filtro ternary trasforma il vero/falso in parole leggibili,
    # cosi nell'elenco si distingue a colpo d'occhio cosa e ancora bozza.
    summary: "{{titolo}}  ·  {{bozza | ternary('BOZZA','pubblicato')}}"
    sortable_fields: [dataPubblicazione, titolo]

    # Pulsanti di filtro sopra l elenco: mostrano solo le bozze o solo
    # i pubblicati, senza cambiare come funziona il salvataggio.
    view_filters:
      - label: 'Solo bozze'
        field: bozza
        pattern: true
      - label: 'Solo pubblicati'
        field: bozza
        pattern: false

    fields:
      - name: titolo
        label: 'Titolo'
        hint: 'Da 15 a 70 caratteri. Oltre i 70, Google lo taglia nei risultati di ricerca.'
        widget: string
        pattern:
          ['^.{15,70}$', 'Il titolo deve essere lungo tra 15 e 70 caratteri.']

      - name: titoloSeo
        label: 'Titolo per Google (facoltativo)'
        hint: 'Massimo 38 caratteri. Da usare quando il titolo in pagina è evocativo ma poco cercato: qui metti le parole che la gente digita. Se lo lasci vuoto viene usato il titolo normale.'
        widget: string
        required: false
        pattern: ['^.{0,38}$', 'Massimo 38 caratteri: il sito aggiunge in coda il proprio nome.']

      - name: descrizione
        label: 'Descrizione per Google'
        hint: 'Da 70 a 170 caratteri. E il testo grigio sotto il titolo nei risultati di ricerca: decide chi clicca.'
        widget: text
        pattern:
          [
            '^[\s\S]{70,170}$',
            'La descrizione deve essere lunga tra 70 e 170 caratteri.',
          ]

      - name: dataPubblicazione
        label: 'Data di pubblicazione'
        widget: datetime
        format: 'YYYY-MM-DD'
        date_format: 'DD/MM/YYYY'
        time_format: false
        hint: >-
          Il giorno in cui l articolo diventa pubblico, non quello in cui hai
          cominciato a scriverlo. Se lo tieni in bozza per qualche giorno,
          ricordati di aggiornarla quando spegni Bozza.
        picker_utc: true

      - name: dataAggiornamento
        label: 'Data di aggiornamento'
        hint: 'Da compilare solo se stai modificando un articolo gia pubblicato.'
        widget: datetime
        format: 'YYYY-MM-DD'
        date_format: 'DD/MM/YYYY'
        time_format: false
        picker_utc: true
        required: false

      - name: categoria
        label: 'Categoria'
        widget: select
        options:
          - 'Economia'
          - 'Finanza personale'
          - 'Società'
          - 'Ambiente ed Energia'
          - 'Istituzioni'

      - name: tag
        label: 'Tag'
        hint: 'Da 2 a 5 parole chiave, in minuscolo.'
        widget: list
        required: false

      - name: illustrazione
        label: 'Illustrazione di apertura'
        hint: 'Il disegno che compare in cima all articolo. Sono disegnati su misura per il sito: nessuna foto da cercare, nessuna licenza.'
        widget: select
        required: false
        options:
          - { label: 'Nessuna', value: '' }
          - { label: 'Metodo — groviglio che diventa freccia', value: 'metodo' }
          - { label: 'Imbuto — soldi che entrano, spiccioli che escono', value: 'imbuto' }
          - { label: 'Pila — carte che bruciano', value: 'pila' }
          - { label: 'Palazzina — condominio e cartella fiscale', value: 'palazzina' }
          - { label: 'Calendario — norma che scade', value: 'calendario' }
          - { label: 'Bilancia — costo da una parte, risultato dall altra', value: 'bilancia' }
          - { label: 'Catena — anelli che sbiadiscono e si spezzano', value: 'catena' }
          - { label: 'Crepa — scossa da Wall Street a Roma', value: 'crepa' }
          - { label: 'Sportelli — saracinesche abbassate, una sola aperta', value: 'sportelli' }
          - { label: 'Risparmi — due pile uguali, una sola misurata', value: 'risparmi' }
          - { label: 'Bolletta — due barre a confronto, gli oneri spariscono', value: 'bolletta' }
          - { label: 'Generazioni — tre file sempre meno numerose', value: 'generazioni' }
          - { label: 'Pensione — stessa busta paga, quota diversa', value: 'pensione' }
          - { label: 'Tetto — due strade bloccate, una lo aggira', value: 'tetto' }
          - { label: 'Provvisorio — lo stesso posto tratteggiato ogni anno', value: 'provvisorio' }
          - { label: 'Scheda — lo spazio per il nome che si riduce', value: 'scheda' }
          - { label: 'Pista — i metri costruiti e quelli utilizzabili', value: 'pista' }

      - name: immagine
        label: 'Immagine di copertina (facoltativa)'
        hint: 'Solo se vuoi una fotografia al posto del disegno. Caricane una grande, almeno 1600 pixel: la rimpicciolisce il sito da solo.'
        widget: image
        required: false

      - name: immagineAlt
        label: 'Descrizione dell immagine'
        hint: 'Obbligatoria se carichi un immagine. Descrivi cosa si vede, per chi non puo vederla.'
        widget: string
        required: false

      - name: bozza
        label: 'Bozza — tienilo acceso finche non e pronto'
        hint: >-
          Acceso: l articolo NON e sul sito, lo vedi solo tu. Spento: va online
          al primo salvataggio. Il pulsante verde in alto salva soltanto, non
          pubblica. PRIMA DI SPEGNERLO risali alla Data di pubblicazione e
          rimetti quella di oggi: e il giorno in cui il pezzo esce, non quello
          in cui hai cominciato a scriverlo.
        widget: boolean
        default: true

      - name: inEvidenza
        label: 'Tienilo in apertura anche quando non e il piu recente'
        hint: >-
          Quasi sempre non serve: in cima alla homepage va da sola la
          pubblicazione piu recente. Accendilo solo per trattenere in apertura
          un pezzo piu vecchio, e su un articolo per volta: con due accesi la
          pubblicazione si ferma e ti dice quali sono.
        widget: boolean
        default: false

      - name: body
        label: 'Testo dell articolo'
        widget: markdown

  - name: proposte
    label: Proposte
    label_singular: Proposta
    description: 'Le soluzioni che escono dagli articoli. Restano valide finche il problema non e risolto: aggiornale quando qualcosa si muove.'
    folder: src/contenuti/proposte
    create: true
    extension: md
    format: yaml-frontmatter
    identifier_field: titolo
    slug: '{{slug}}'
    summary: "{{titolo}}  ·  {{stato}}  ·  {{bozza | ternary('BOZZA','pubblicata')}}"
    sortable_fields: [dataPubblicazione, titolo, stato]

    view_filters:
      - label: 'Solo bozze'
        field: bozza
        pattern: true
      - label: 'Solo pubblicate'
        field: bozza
        pattern: false

    fields:
      - name: titolo
        label: 'Titolo'
        hint: 'Da 15 a 70 caratteri. Dì cosa si propone, non quale problema risolve.'
        widget: string
        pattern:
          ['^.{15,70}$', 'Il titolo deve essere lungo tra 15 e 70 caratteri.']

      - name: titoloSeo
        label: 'Titolo per Google (facoltativo)'
        hint: 'Massimo 38 caratteri.'
        widget: string
        required: false
        pattern: ['^.{0,38}$', 'Massimo 38 caratteri.']

      - name: descrizione
        label: 'Descrizione per Google'
        hint: 'Da 70 a 170 caratteri.'
        widget: text
        pattern:
          [
            '^[\s\S]{70,170}$',
            'La descrizione deve essere lunga tra 70 e 170 caratteri.',
          ]

      - name: problema
        label: 'Il problema, in una frase'
        hint: 'E la riga che il lettore legge per prima: cosa non funziona, senza girarci intorno.'
        widget: text
        pattern:
          [
            '^[\s\S]{30,220}$',
            'Tienilo tra 30 e 220 caratteri: il resto va nel corpo della proposta.',
          ]

      - name: ambito
        label: 'Ambito'
        widget: select
        options:
          - 'Burocrazia'
          - 'Fisco'
          - 'Giustizia'
          - 'Lavoro'
          - 'Sanità'
          - 'Scuola'
          - 'Energia'
          - 'Trasporti'
          - 'Istituzioni'
          - 'Ambiente'
          - 'Conti pubblici'
          - 'Credito e risparmio'
          - 'Welfare'

      - name: stato
        label: 'A che punto è'
        hint: 'Usa "Già applicata altrove" solo se puoi linkare la norma straniera nel testo.'
        widget: select
        default: 'Proposta'
        options:
          - 'Proposta'
          - 'In discussione'
          - 'Già applicata altrove'
          - 'Realizzata'

      - name: difficolta
        label: 'Difficoltà di realizzazione'
        widget: select
        default: 'Media'
        options: ['Bassa', 'Media', 'Alta']

      - name: origine
        label: 'Da dove viene'
        widget: select
        default: 'Analisi della redazione'
        options:
          - 'Analisi della redazione'
          - 'Segnalazione di un lettore'

      - name: articoloCollegato
        label: 'Articolo da cui nasce (facoltativo)'
        hint: "Il nome del file dell articolo, senza estensione. Esempio: quanto-costa-la-burocrazia-in-italia"
        widget: string
        required: false

      - name: dataPubblicazione
        label: 'Data di pubblicazione'
        widget: datetime
        format: 'YYYY-MM-DD'
        date_format: 'DD/MM/YYYY'
        time_format: false
        hint: >-
          Il giorno in cui l articolo diventa pubblico, non quello in cui hai
          cominciato a scriverlo. Se lo tieni in bozza per qualche giorno,
          ricordati di aggiornarla quando spegni Bozza.
        picker_utc: true

      - name: dataAggiornamento
        label: 'Data di aggiornamento'
        hint: 'Da compilare quando lo stato della proposta cambia.'
        widget: datetime
        format: 'YYYY-MM-DD'
        date_format: 'DD/MM/YYYY'
        time_format: false
        picker_utc: true
        required: false

      - name: bozza
        label: 'Bozza — tienilo acceso finche non e pronto'
        hint: 'Acceso: l articolo NON e sul sito, lo vedi solo tu. Spento: va online al primo salvataggio. Il pulsante verde in alto salva soltanto, non pubblica.'
        widget: boolean
        default: true

      - name: body
        label: 'La proposta, per esteso'
        widget: markdown
